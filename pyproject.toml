[project]
name = "huanmeng"
version = "3.0.0a0"
description = "幻梦 3.0 微内核"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
adapters = ["httpx>=0.27", "websockets>=12"]
web = ["aiohttp>=3.9"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "websockets>=12", "aiohttp>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kernel", "runtime"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
